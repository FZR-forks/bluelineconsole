name: Build and release APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'release' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set version metadata
        shell: bash
        run: |
          UPSTREAM_VERSION="$(sed -n 's/.*versionName .*?: "\([^"]*\)".*/\1/p' app/build.gradle)"
          test -n "$UPSTREAM_VERSION"
          VERSION_NAME="${UPSTREAM_VERSION}-$(git rev-parse --short=8 HEAD)"
          VERSION_CODE="$((1000000 + $(git rev-list --first-parent --count HEAD)))"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_APK=bluelineconsole-${VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: Test and lint
        run: |
          ./gradlew testDebugUnitTest lintRelease --stacktrace || {
            find app/build -name lint-results-release.txt -exec cat {} \;
            exit 1
          }

      - name: License check
        run: ./ci/license-checker.py

      - name: Prepare private signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.BLC_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BLC_RELEASE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure BLC_RELEASE_KEYSTORE_BASE64 and BLC_RELEASE_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bluelineconsole.p12"
          keytool -list -keystore "$RUNNER_TEMP/bluelineconsole.p12" -storepass:env KEYSTORE_PASSWORD -alias bluelineconsole > /dev/null
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/bluelineconsole.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.BLC_RELEASE_KEYSTORE_PASSWORD || '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          [[ "${#APKS[@]}" -eq 1 ]]
          cp "${APKS[0]}" "$RELEASE_APK"

      - name: Verify signed APK and version metadata
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RELEASE_APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RELEASE_APK")"
          grep -F "name='net.nhiroki.bluelineconsole'" <<< "$BADGING"
          grep -F "versionCode='$VERSION_CODE'" <<< "$BADGING"
          grep -F "versionName='$VERSION_NAME'" <<< "$BADGING"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bluelineconsole-${{ env.VERSION_NAME }}
          path: |
            ${{ env.RELEASE_APK }}
            ${{ env.RELEASE_APK }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          RELEASE_TAG="${EXISTING_RELEASE_TAG:-$TAG}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_APK.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_APK.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Blue Line Console $VERSION_NAME" \
              --notes "Based on upstream $VERSION_NAME, preserving this fork's app actions, file search, accessibility shortcuts, and usage ranking. Android version code: $VERSION_CODE. Add https://github.com/$GITHUB_REPOSITORY to Obtainium."
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bluelineconsole.p12"
