apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'

    namespace 'net.nhiroki.bluelineconsole'
    defaultConfig {
        applicationId "net.nhiroki.bluelineconsole"
        versionCode = (System.getenv('VERSION_CODE') ?: '44').toInteger()
        versionName = System.getenv('VERSION_NAME') ?: "1.2.25"

        minSdkVersion 23
        targetSdkVersion 36
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (System.getenv('RELEASE_KEYSTORE_PATH')) {
            forkRelease {
                storeFile file(System.getenv('RELEASE_KEYSTORE_PATH'))
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias 'bluelineconsole'
                keyPassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('RELEASE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.forkRelease
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    lint {
        ignoreWarnings false
    }
    buildFeatures {
        buildConfig true
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.activity:activity:1.12.4'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
